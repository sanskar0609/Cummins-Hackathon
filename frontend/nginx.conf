server {
    listen 80;
    server_name localhost;

    # GZIP compress network payloads aggressively
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        
        # Fundamental resolution configuration for React Router.
        # This prevents 404 NGINX faults when reloading specific deeply nested components.
        try_files $uri $uri/ /index.html;
    }

    # Proxy core endpoints optionally to backend directly 
    # to avoid complex external network configurations
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
