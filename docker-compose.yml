version: '3.8'

services:
  # 1. Edge Delivery (Vite + NGINX)
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - scos_network

  # 2. Intelligence API Core (FastAPI / LangGraph)
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
    env_file:
      - ./backend/.env
    environment:
      # Absolute override forcing Docker internal hostname mappings
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://scuser:scuser@postgres:5432/supply_chain
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=admin123
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - postgres
      - redis
      - neo4j
    networks:
      - scos_network

  # 3. Persistent Core (PostgreSQL)
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: scuser
      POSTGRES_PASSWORD: scuser
      POSTGRES_DB: supply_chain
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - scos_network

  # 4. Vector / Map Buffer (Redis)
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - scos_network

  # 5. Graph Intelligence (Neo4j)
  neo4j:
    image: neo4j:5.11
    restart: always
    environment:
      NEO4J_AUTH: neo4j/admin123
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    networks:
      - scos_network

  # 6. Stream Cluster Controller (Zookeeper)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - scos_network

  # 7. Live Stream Broker (Kafka)
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - scos_network

  # 8. Model Accuracy Daemon (MLFlow)
  mlflow:
    image: python:3.11-slim
    restart: always
    ports:
      - "5000:5000"
    command: >
      bash -c "pip install mlflow && mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow/artifacts"
    volumes:
      - mlflowdata:/mlflow
    networks:
      - scos_network

  # 9. Pipeline Cron Array (Apache Airflow)
  airflow-scheduler:
    image: apache/airflow:2.7.1
    command: standalone
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - _AIRFLOW_DB_UPGRADE=True
      - _AIRFLOW_WWW_USER_CREATE=True
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    ports:
      - "8085:8080"
    volumes:
      - ./backend/airflow/dags:/opt/airflow/dags
      - ./backend/data/reports:/opt/airflow/data/reports
    networks:
      - scos_network

volumes:
  pgdata:
  redisdata:
  neo4jdata:
  mlflowdata:

networks:
  scos_network:
    driver: bridge
